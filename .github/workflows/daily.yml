name: daily-data
 
on:
  schedule:
    # 슬롯을 3개로 줄였다. GitHub 예약은 밀리거나 버려지는 일이 잦아
    # 재시도용으로 간격을 넉넉히 둔다. (여름 기준 한국시간)
    - cron: "40 20 * * 1-5"   # 05:40 — 마감 +40분, 본 실행
    - cron: "40 21 * * 1-5"   # 06:40 — 재시도 / 겨울 본 실행
    - cron: "40 22 * * 1-5"   # 07:40 — 마지막 예비
  workflow_dispatch:
    inputs:
      force:
        description: "최신이어도 다시 계산"
        type: boolean
        default: false
 
permissions:
  contents: write
 
concurrency:
  group: daily-data
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: 패키지 설치
        run: pip install --quiet yfinance pandas numpy requests lxml html5lib beautifulsoup4
 
      - name: data.json 생성
        run: python build_data.py --out data.json ${{ inputs.force && '--force' || '' }}
 
      - name: 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
